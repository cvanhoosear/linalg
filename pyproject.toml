[project]
name = "linalg"
version = "0.1.0"
description = "A simple project for linear algebra calculations."
authors = [
    { name = "Christopher Van Hoosear", email = "cvanhoosear@gmail.com" }
]

readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "mypy>=1.10",
  "pip-tools>=7",
  "pipdeptree>=2.23",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
